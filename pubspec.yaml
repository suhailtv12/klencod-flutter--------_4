name: al_jeel_school
description: "تطبيق مدرسة الجيل الأساسية الثانوية لمتابعة الحضور والغياب والإدارة الذكية الموحدة"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # دعم اللغة العربية والاتجاه من اليمين لليسار (RTL)
  flutter_localizations:
    sdk: flutter

  # ==============================
  # خدمات فايربيس (Firebase Ecosystem)
  # ==============================
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # ==============================
  # ماسح الكاميرا الحقيقي للبطاقات المدرسية
  # ==============================
  mobile_scanner: ^5.2.3

  # ==============================
  # نظام الإشعارات والتنبيهات اللحظية
  # ==============================
  flutter_local_notifications: ^17.2.3

  # ==============================
  # طبقة الأمان، التشفير والتخزين
  # ==============================
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2

  # ==============================
  # إدارة الصلاحيات والأذونات (الكاميرا والإشعارات)
  # ==============================
  permission_handler: ^11.3.1

  # ==============================
  # الخطوط والتنسيقات الزمنية
  # ==============================
  google_fonts: ^6.2.1
  intl: ^0.20.3        # تم التحديث لحل التعارض مع إصدار Flutter الحديث

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true